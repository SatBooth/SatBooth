# The private hub host (deploy/README.md, "The hub host"): Alby Hub, SatBooth's NWC relay, bitcoind (pruned by default)
# and, optionally, the hub's Electrum server (Fulcrum, profile electrum), monerod and SatBooth's view-only
# monero-wallet-rpc (profile monero). Never the host of the public SatBooth service.
#   docker compose -f deploy/hub/compose.yml --env-file <your copy of example.env> [--profile electrum]
#     [--profile monero] up -d --build
#   The relay is the pinned release image. To build it from source instead, add -f deploy/hub/compose.build.yml after
#   -f deploy/hub/compose.yml.
# Every value the operator gives comes from the env file (deploy/hub/example.env: addresses and paths, no secrets).
# Secrets are files in HUB_CONFIG_DIR, bind-mounted read-only; none is in an environment: value or in argv.
# Published ports: the hub's admin UI on HUB_ADMIN_ADDR (loopback: reached through an SSH tunnel, never from the public
# host), and on HUB_PRIVATE_ADDR (the private link to the public host) only what SatBooth calls: the relay, bitcoind's
# RPC and, with the monero profile, wallet-rpc. The electrum profile needs an unpruned bitcoind with txindex=1 (the
# full chain, not the pruned default, plus Fulcrum's index): bitcoin.conf, fulcrum.conf and HUB_ELECTRUM_SERVER
# (tcp://fulcrum:50001) go with it. The ${VAR:?} form makes an empty or missing address an error: an empty host would
# publish on every interface.
name: satbooth-hub

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # Restarted on a failure and after the daemon or the host restarts; not after a manual stop. on-failure would not come
  # back after a reboot (deploy/README.md, "Restarts").
  restart: unless-stopped
  stop_grace_period: 30s

services:
  # One-shot, as root with only CHOWN, FOWNER and DAC_READ_SEARCH (to list a directory it no longer owns on the next
  # up; no write), no network: each container's files go to its own user, directories 0700. Named volumes start owned
  # by root; bind-mounted files keep the host's owner. Modes of files are left alone, so a loose secret file is still
  # refused by whatever reads it. relay.json is given to 65532 only if it exists (the relay service itself does not
  # start without it). fulcrum.conf (the electrum profile) is given to 10004 only if it exists; the Fulcrum volume is
  # prepared either way, and stays empty without the profile. The Monero files are optional (the monero profile, or
  # monerod and wallet-rpc on a third host): only those present are given to 10002.
  volume-init:
    image: debian:13-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    network_mode: none
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    command:
      - sh
      - -euc
      - |
        chown 10003:10003 /vol/hub /config/hub.env
        chown 10001:10001 /vol/bitcoind /config/bitcoin.conf
        chown 10004:10004 /vol/fulcrum
        chown 10002:10002 /vol/monerod
        chown -R 10002:10002 /wallet
        chmod 0700 /vol/hub /vol/bitcoind /vol/fulcrum /vol/monerod /wallet
        if [ -e /config/fulcrum.conf ]; then chown 10004:10004 /config/fulcrum.conf; fi
        if [ -e /config/relay.json ]; then chown 65532:65532 /config/relay.json; fi
        if [ -e /config/hub-ca.pem ]; then chown 10003:10003 /config/hub-ca.pem; fi
        if [ -e /config/stub-cert.pem ]; then chown 65532:65532 /config/stub-cert.pem /config/stub-key.pem; fi
        if [ -e /config/monerod.conf ]; then chown 10002:10002 /config/monerod.conf; fi
        if [ -e /config/wallet-rpc ]; then chown -R 10002:10002 /config/wallet-rpc; chmod 0700 /config/wallet-rpc; fi
    volumes:
      - hub-data:/vol/hub
      - bitcoind-data:/vol/bitcoind
      - fulcrum-data:/vol/fulcrum
      - monerod-data:/vol/monerod
      - ${HUB_CONFIG_DIR:?set HUB_CONFIG_DIR}:/config
      - ${MONERO_WALLET_DIR:?set MONERO_WALLET_DIR}:/wallet

  # Holds the network namespace that the hub and the relay share: the relay's hub listener is on loopback (it needs no
  # login, so it must not be reachable from outside), and the hub reaches it at ws://127.0.0.1:7447. A container that
  # joins another's namespace loses its network when that container restarts, and gets it back when it restarts
  # itself; this one only sleeps, so the hub and the relay can each restart on their own (deploy/README.md).
  netns:
    <<: *hardening
    image: debian:13-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    user: "65534:65534"
    # docker-init as PID 1, so that the stop signal ends the sleep at once.
    init: true
    command: ["sleep", "infinity"]
    networks:
      hub:
        ipv4_address: ${HUB_IP:?set HUB_IP}
      electrum: {}
    # The names the hub would call at Alby, mempool.space, Boltz and Megalith (and the stub's own) are the stub's: the
    # hub shares this container's network and its /etc/hosts (Docker refuses extra_hosts on a container that joins a
    # namespace), so a lookup never leaves the host. They are exactly setup's StubNames, the names of the stub's
    # certificate (TestHubStubWiring). Any other name the hub asks for is not pinned: it has no route out and trusts
    # no certificate authority but the bundle's.
    extra_hosts:
      - "hubstub:${HUB_STUB_IP:?set HUB_STUB_IP}"
      - "getalby.com:${HUB_STUB_IP:?set HUB_STUB_IP}"
      - "api.getalby.com:${HUB_STUB_IP:?set HUB_STUB_IP}"
      - "mempool.space:${HUB_STUB_IP:?set HUB_STUB_IP}"
      - "api.boltz.exchange:${HUB_STUB_IP:?set HUB_STUB_IP}"
      - "api.satsrouting.exchange:${HUB_STUB_IP:?set HUB_STUB_IP}"
      - "megalithic.me:${HUB_STUB_IP:?set HUB_STUB_IP}"
      - "electrum.getalbypro.com:${HUB_STUB_IP:?set HUB_STUB_IP}"
      - "vss.getalbypro.com:${HUB_STUB_IP:?set HUB_STUB_IP}"
    # Docker's embedded resolver (127.0.0.11) answers the bundle's service names and the names above itself, and sends a
    # query for any other name to the servers listed here. Measured on Docker Engine 29.4.2: it sends them from the HOST's
    # network namespace, not from this one, so the host's firewall rules for this namespace never see them and the
    # host's own resolver would carry them to the internet. The one server listed is the stub's address: its container
    # has no DNS port, the host reaches it over the internal electrum network, and the query fails there: the name never resolves (measured at 12 to 13 s a lookup).
    # A container of this bundle without this setting (bitcoind, Fulcrum and the Monero services, which may need the
    # internet) resolves through the host's resolver. The relay, the proxy and the hub share this namespace and its
    # resolver; the stub is on the internal electrum network alone and has no route out.
    dns:
      - "${HUB_STUB_IP:?set HUB_STUB_IP}"
    ports:
      # The hub's web UI and API: the operator's admin access (setup, unlock, channels, pairing, backups). Never on
      # HUB_PRIVATE_ADDR: the public host reaches that address, and the UI controls the node's funds.
      - "${HUB_ADMIN_ADDR:?set HUB_ADMIN_ADDR}:8080:8080"
      # The relay's client listener: SatBooth's NWC connections (NIP-42 AUTH).
      - "${HUB_PRIVATE_ADDR:?set HUB_PRIVATE_ADDR}:7448:7448"

  hub:
    <<: *hardening
    image: ghcr.io/getalby/hub:v1.24.7@sha256:7e3de6dac330fb8a426c02a247d81ebaf07deece22634e97d8f20dd48c3a8e38
    user: "10003:10003"
    network_mode: service:netns
    # The hub loads .env from its working directory (getAlby/hub v1.24.7 service/service.go:56, godotenv.Load(".env"),
    # which never overrides a variable already set): hub.env holds LDK_BITCOIND_RPC_PASSWORD and nothing set below.
    working_dir: /etc/albyhub
    environment:
      WORK_DIR: /data
      # The hub listens on 8081, in the namespace it shares with hubproxy, which holds the published port 8080: the
      # operator reaches the UI through the proxy only (deploy/README.md, "The UI proxy").
      PORT: "8081"
      NETWORK: ${HUB_NETWORK:?set HUB_NETWORK}
      LOG_LEVEL: "4"
      LDK_BITCOIND_RPC_HOST: bitcoind
      LDK_BITCOIND_RPC_PORT: "8332"
      LDK_BITCOIND_RPC_USER: hub
      SEND_EVENTS_TO_ALBY: "false"
      AUTO_LINK_ALBY_ACCOUNT: "false"
      RELAY: ws://127.0.0.1:7447
      # Every other outside default of the hub, disabled or redirected (getAlby/hub v1.24.7, config/models.go):
      # - BOLTZ_API and MEMPOOL_API: the swap provider and the mempool API are the bundle's own stub, the hubstub
      #   service. A non-empty BOLTZ_API is also what stops the hub asking getalby.com which swap provider to use at
      #   every start (swaps/swaps_service.go:96-103). The hub appends its paths to MEMPOOL_API (api/api.go:1444).
      # - LDK_LSPS2_ADDRESSES: "none" parses to no liquidity provider, and the hub then never contacts one when it makes
      #   an invoice (lnclient/ldk/ldk.go:174-202, 2949-2966). Empty would leave its built-in Megalith node on.
      # - LDK_GOSSIP_SOURCE: empty, so no rapid gossip sync server; gossip comes from connected peers only.
      # - REBALANCE_SERVICE_URL and LDK_VSS_URL: Megalith's rebalance service and Alby's VSS server, redirected to the
      #   stub as well (api/rebalance.go:60-75; lnclient/ldk/ldk.go:282-288).
      # - HIDE_UPDATE_BANNER: hides the banner; the hub still asks its update check, which the stub answers.
      # - SSL_CERT_FILE and SSL_CERT_DIR: the hub trusts one certificate authority, the bundle's, and no system root, so
      #   a TLS connection to any real host fails. The authority's certificate is config/hub-ca.pem (made by setup),
      #   mounted below; /etc/satbooth/no-roots exists nowhere, so the system roots are never read.
      BOLTZ_API: https://hubstub
      REBALANCE_SERVICE_URL: https://hubstub
      LDK_VSS_URL: https://hubstub
      MEMPOOL_API: https://hubstub/api
      LDK_LSPS2_ADDRESSES: none
      LDK_GOSSIP_SOURCE: ""
      HIDE_UPDATE_BANNER: "true"
      SSL_CERT_FILE: /etc/satbooth/ca.pem
      SSL_CERT_DIR: /etc/satbooth/no-roots
      # With bitcoind as LDK's chain source, the hub uses an Electrum server only to look up on-chain addresses
      # (rotating its deposit address, auto swap-out to an xpub), and Alby's is the default (getAlby/hub v1.24.7
      # chain/address_lookup.go:22-28, lnclient/ldk/ldk.go:216-231). HUB_ELECTRUM_SERVER is the bundle's own Fulcrum
      # (tcp://fulcrum:50001, with the electrum profile) or an address nothing listens on (tcp://127.0.0.1:9), so
      # that the hub's address lookups call no third party and fail locally.
      LDK_ELECTRUM_SERVER: ${HUB_ELECTRUM_SERVER:?set HUB_ELECTRUM_SERVER}
    volumes:
      - hub-data:/data
      - type: bind
        source: ${HUB_CONFIG_DIR:?set HUB_CONFIG_DIR}/hub.env
        target: /etc/albyhub/.env
        read_only: true
        bind:
          create_host_path: false
      # The one certificate authority the hub trusts (SSL_CERT_FILE below); its key is in setup/, never here.
      - type: bind
        source: ${HUB_CONFIG_DIR:?set HUB_CONFIG_DIR}/hub-ca.pem
        target: /etc/satbooth/ca.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      volume-init:
        condition: service_completed_successfully
      netns:
        condition: service_started
      bitcoind:
        condition: service_started
      hubstub:
        condition: service_started

  relay:
    <<: *hardening
    # The one pin line of the relay image (scripts/release-pins.sh): the stub and the other binaries of the image use
    # the anchor, so a release changes one line.
    image: &relay_image ghcr.io/satbooth/satbooth-relay:v0.1.0-rc.1@sha256:bd7b71e07a3f62556b30885335486451a98037adab179eafc5918284eca92ad8
    network_mode: service:netns
    command: ["-config", "/etc/satbooth-relay/relay.json"]
    volumes:
      - type: bind
        source: ${HUB_CONFIG_DIR:?set HUB_CONFIG_DIR}/relay.json
        target: /etc/satbooth-relay/relay.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      volume-init:
        condition: service_completed_successfully
      netns:
        condition: service_started

  # The proxy in front of the hub's web UI (satbooth-hubproxy, in the relay image): it listens on 8080, the port the
  # netns container publishes on HUB_ADMIN_ADDR, forwards to the hub on 127.0.0.1:8081 and replaces the response's
  # content policy with one that allows the page's own origin and nothing else, so the operator's browser never loads
  # or calls anything outside the bundle. Same pin as the relay (after it: the anchor is defined there), and the same note as the stub: the pinned rc.1 image
  # does not hold it yet, build from source until the pin moves.
  hubproxy:
    <<: *hardening
    image: *relay_image
    entrypoint: ["/satbooth-hubproxy"]
    command: ["-listen", ":8080", "-upstream", "http://127.0.0.1:8081"]
    network_mode: service:netns
    depends_on:
      netns:
        condition: service_started

  # Answers the hub's calls to Alby, mempool.space, Boltz and Megalith locally (satbooth-hubstub, in the relay image),
  # over TLS with a certificate from the bundle's own authority, at HUB_STUB_IP. It is on the internal electrum network
  # alone: it has no route out and nothing outside can reach it. It listens on 443 as 65532 with every capability
  # dropped: the sysctl lowers the first unprivileged port in this container's own network namespace only (it is
  # namespaced, so the host and the other containers keep theirs), which needs no capability and no setcap, neither of
  # which a non-root process in a scratch image has.
  hubstub:
    <<: *hardening
    # The relay image holds the stub from the release after v0.1.0-rc.1: with the pinned rc.1 image the start fails with
    # "exec: /satbooth-hubstub: not found" and the hub never starts (it waits for the stub). Until the pin moves, build
    # the bundle from source with compose.build.yml (deploy/README.md).
    image: *relay_image
    entrypoint: ["/satbooth-hubstub"]
    command: ["-cert", "/etc/satbooth/stub-cert.pem", "-key", "/etc/satbooth/stub-key.pem", "-listen", ":443"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    volumes:
      - type: bind
        source: ${HUB_CONFIG_DIR:?set HUB_CONFIG_DIR}/stub-cert.pem
        target: /etc/satbooth/stub-cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HUB_CONFIG_DIR:?set HUB_CONFIG_DIR}/stub-key.pem
        target: /etc/satbooth/stub-key.pem
        read_only: true
        bind:
          create_host_path: false
    networks:
      electrum:
        ipv4_address: ${HUB_STUB_IP:?set HUB_STUB_IP}
    depends_on:
      volume-init:
        condition: service_completed_successfully

  bitcoind:
    <<: *hardening
    build: ./bitcoind
    image: satbooth-hub-bitcoind:local
    volumes:
      - bitcoind-data:/data
      - type: bind
        source: ${HUB_CONFIG_DIR:?set HUB_CONFIG_DIR}/bitcoin.conf
        target: /etc/bitcoin/bitcoin.conf
        read_only: true
        bind:
          create_host_path: false
    networks: [hub, electrum]
    ports:
      # bitcoind's RPC: SatBooth's on-chain rail, as its whitelisted RPC user.
      - "${HUB_PRIVATE_ADDR:?set HUB_PRIVATE_ADDR}:8332:8332"
    depends_on:
      volume-init:
        condition: service_completed_successfully

  # Fulcrum, the hub's Electrum server (optional: docker compose --profile electrum …): it indexes the bundle's
  # bitcoind (which then must be unpruned, with txindex=1: the full chain, plus Fulcrum's own index) and serves the
  # hub only. Without it the hub's address lookups fail, and nothing of SatBooth's or of the hub's payments depends on
  # them.
  # It is on the internal electrum network alone: it can reach bitcoind and the hub can reach it, and it has no route
  # out, so it can neither peer with other servers nor be reached from anywhere else. Not published. Its configuration
  # (fulcrum.conf, 0600: the RPC user's password) is the operator's; the paths and listeners are fixed here.
  fulcrum:
    <<: *hardening
    profiles: [electrum]
    build: ./fulcrum
    image: satbooth-hub-fulcrum:local
    command: ["--datadir", "/data", "--bitcoind", "bitcoind:8332", "--tcp", "0.0.0.0:50001",
      "/etc/fulcrum/fulcrum.conf"]
    # Fulcrum flushes its database on SIGTERM; a large index takes a while.
    stop_grace_period: 180s
    tmpfs: [/tmp]
    volumes:
      - fulcrum-data:/data
      - type: bind
        source: ${HUB_CONFIG_DIR:?set HUB_CONFIG_DIR}/fulcrum.conf
        target: /etc/fulcrum/fulcrum.conf
        read_only: true
        bind:
          create_host_path: false
    networks: [electrum]
    depends_on:
      volume-init:
        condition: service_completed_successfully
      bitcoind:
        condition: service_started

  # Monero (optional): docker compose --profile monero …, once the files of "The hub host" exist.
  monerod:
    <<: *hardening
    profiles: [monero]
    build: ./monero
    image: satbooth-hub-monero:local
    # monerod refuses non-interactive in its config file; it goes here. --restricted-rpc is here too, where the
    # operator's file cannot drop it: it removes set_bootstrap_daemon, pop_blocks, flush_txpool, out_peers, stop_daemon
    # and the others (monero v0.18.5.4 src/rpc/core_rpc_server.h:113-189), and keeps every call wallet2 makes, with
    # per-call limits that wallet2 handles (wallet2.cpp:3177); pool transactions still in their Dandelion++ stem stay
    # hidden until they are fluffed (core_rpc_server.cpp:651-654).
    command: ["monerod", "--config-file", "/etc/monero/monerod.conf", "--data-dir", "/data", "--non-interactive",
      "--restricted-rpc"]
    tmpfs: [/tmp]
    volumes:
      - monerod-data:/data
      - type: bind
        source: ${HUB_CONFIG_DIR:?set HUB_CONFIG_DIR}/monerod.conf
        target: /etc/monero/monerod.conf
        read_only: true
        bind:
          create_host_path: false
    # Only on the monero network: no other container of the bundle can call monerod's RPC.
    networks: [monero]
    depends_on:
      volume-init:
        condition: service_completed_successfully

  wallet-rpc:
    <<: *hardening
    profiles: [monero]
    build: ./monero
    image: satbooth-hub-monero:local
    entrypoint: ["/usr/local/bin/wallet-rpc.sh"]
    tmpfs: ["/tmp:size=32m"]
    volumes:
      - ${MONERO_WALLET_DIR:?set MONERO_WALLET_DIR}:/wallet
      - type: bind
        source: ${HUB_CONFIG_DIR:?set HUB_CONFIG_DIR}/wallet-rpc
        target: /etc/wallet-rpc
        read_only: true
        bind:
          create_host_path: false
    networks: [monero]
    ports:
      # wallet-rpc's JSON-RPC: SatBooth's Monero rail, with the Digest login.
      - "${HUB_PRIVATE_ADDR:?set HUB_PRIVATE_ADDR}:18083:18083"
    depends_on:
      volume-init:
        condition: service_completed_successfully
      monerod:
        condition: service_started

networks:
  # enable_ipv6 is off on the hub and electrum networks whatever the daemon's default: the egress rules are IPv4 only.
  hub:
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${HUB_SUBNET:?set HUB_SUBNET}
  # netns (the hub), bitcoind, the stub and Fulcrum, with no route out: Fulcrum's and the stub's only network. It exists without the electrum
  # profile too (the hub and bitcoind are always on it, and Compose cannot attach them conditionally), unused, so
  # ELECTRUM_SUBNET is always set.
  electrum:
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${ELECTRUM_SUBNET:?set ELECTRUM_SUBNET}
  # monerod and wallet-rpc only. Not internal: wallet-rpc publishes 18083 and monerod connects out to its peers. A
  # container on the hub network (the hub, the relay, bitcoind) cannot reach monerod's RPC, so it cannot point monerod
  # at a chain of its own making.
  monero: {}

volumes:
  hub-data:
  bitcoind-data:
  fulcrum-data:
  monerod-data:
