# Example monerod.conf for the hub bundle (deploy/hub/compose.yml mounts it read-only at /etc/monero/monerod.conf).
# The data directory (/data, the monerod-data volume) and --non-interactive are on the command line in compose.yml:
# monerod refuses non-interactive here. See deploy/README.md and README.md "Setting up monerod and monero-wallet-rpc".

# A pruned node is enough for SatBooth's view-only wallet.
prune-blockchain=1
no-igd=1

# The RPC is for wallet-rpc only: monerod is alone with it on the bundle's monero network, the RPC is not published, and
# compose.yml adds --restricted-rpc. monerod listens on every address of its container.
rpc-bind-ip=0.0.0.0
rpc-bind-port=18081
confirm-external-bind=1

log-level=0
