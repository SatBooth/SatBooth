# Example fulcrum.conf for the hub bundle (deploy/hub/compose.yml mounts it read-only at /etc/fulcrum/fulcrum.conf).
# It holds the RPC password: keep it 0600. The data directory, bitcoind's address and the listener are fixed on the
# command line in compose.yml (--datadir /data, --bitcoind bitcoind:8332, --tcp 0.0.0.0:50001). See deploy/README.md.

# Fulcrum's RPC user at bitcoind (rpcauth=fulcrum:… in bitcoin.conf).
rpcuser = fulcrum
rpcpassword = <the fulcrum user's password>

# A private server for the hub: no peer discovery and no announcement. The bundle's electrum network has no route out
# in any case.
peering = false
announce = false
