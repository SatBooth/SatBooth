# Example bitcoin.conf for the hub bundle (deploy/hub/compose.yml mounts it read-only at /etc/bitcoin/bitcoin.conf).
# The data directory is fixed at /data (the bitcoind-data volume). Placeholders are in <angle brackets>; the hashed
# rpcauth lines are not passwords, but keep the file 0600 all the same. See deploy/README.md and README.md "Setting up
# bitcoind (on-chain)".

# Mainnet. For signet, set chain=signet and rename the [main] section to [signet] (HUB_NETWORK=signet).
chain=main
server=1
# Fulcrum, the bundle's Electrum server, needs the transaction index (and an unpruned node).
txindex=1

[main]
# The bundle fixes the RPC port at 8332 on every chain: the hub calls bitcoind:8332, and 8332 is published on
# HUB_PRIVATE_ADDR for SatBooth. bitcoind listens on every address of its container; who may call is set below.
rpcbind=0.0.0.0
rpcport=8332
# Only the callers that need the RPC: the hub network (HUB_SUBNET: the hub, beside bitcoind itself), the internal
# electrum network (ELECTRUM_SUBNET: the hub and Fulcrum, beside bitcoind), and the public host's address on the private
# link (SatBooth). monerod and wallet-rpc are on their own network and cannot reach bitcoind.
rpcallowip=172.30.78.0/25
rpcallowip=172.30.78.128/25
rpcallowip=192.0.2.10/32

# The hub's RPC user (LDK_BITCOIND_RPC_USER=hub, fixed in compose.yml; its password goes in hub.env as
# LDK_BITCOIND_RPC_PASSWORD). Make the line and a password with share/rpcauth/rpcauth.py hub. Confined to the eleven
# calls the hub's chain source makes (Alby Hub v1.24.6's ldk-node with lightning-block-sync 0.2.0; the source lines are
# in docs/dependencies.md §8): the chain tip, headers and blocks; the mempool and its transactions; fee estimates; the
# broadcast. getblockhash and gettxout check the channels announced over gossip, which the hub verifies because
# LDK_GOSSIP_SOURCE is left empty.
rpcauth=hub:<salt>$<hash>
rpcwhitelist=hub:getblockchaininfo,getblockheader,getblock,getblockhash,gettxout,getrawmempool,getmempoolentry,getrawtransaction,getmempoolinfo,estimatesmartfee,sendrawtransaction

# Fulcrum's RPC user, for its index; its password goes in fulcrum.conf. Make the line with
# share/rpcauth/rpcauth.py fulcrum. Confined to the calls Fulcrum 2.1.4 makes to a Bitcoin Core node (its source:
# BitcoinD.cpp, Controller.cpp, Servers.cpp, SynchMempoolTask.cpp, Mempool.cpp; help is its ping when uptime is
# missing). Left out: getdsproof, getdsprooflist and estimatefee (Bitcoin Cash nodes only; the dsproof probe then
# reads as "lacks the RPC") and daemon.passthrough, which is off unless configured.
rpcauth=fulcrum:<salt>$<hash>
rpcwhitelist=fulcrum:getblockchaininfo,getnetworkinfo,getzmqnotifications,uptime,help,getblockhash,getblock,getblockheader,getrawmempool,getrawtransaction,getmempoolinfo,estimatesmartfee,sendrawtransaction,submitpackage,validateaddress

# SatBooth's RPC user, confined to the twelve methods its client allows. Make the line with
# share/rpcauth/rpcauth.py satbooth; the password goes in SatBooth's onchain.rpc_password_file on the public host.
rpcauth=satbooth:<salt>$<hash>
rpcwhitelist=satbooth:getnewaddress,getaddressinfo,deriveaddresses,listsinceblock,gettransaction,getmempoolentry,getblockchaininfo,getwalletinfo,listdescriptors,getdescriptorinfo,getmempoolinfo,gettxspendingprevout
# A user without an rpcwhitelist line stays unrestricted: the cookie that bitcoin-cli uses inside the container
# (deploy/README.md, the watch-only wallet). Without this line, the lines above would deny it every call.
rpcwhitelistdefault=0
