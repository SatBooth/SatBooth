# Test-only monerod for the regtest network (dev/regtest/compose.yml). No peers (offline), blocks only by the
# generateblocks RPC, unrestricted RPC on the internal network for the qualification's generateblocks, pop_blocks and
# flush_txpool.
# --non-interactive is on the command line (compose.yml): monerod v0.18.5.4 refuses it in a config file ("Option
# 'non-interactive' is not allowed in the config file").
regtest=1
offline=1
fixed-difficulty=1
rpc-bind-ip=172.30.78.3
rpc-bind-port=18081
confirm-external-bind=1
no-igd=1
log-level=1
