# Dev-only override for TestDeployPublic (scripts/qualify.sh): deploy/public/compose.yml runs unmodified with this file
# and deploy-public.env. The only change: SatBooth also joins the regtest network (internal), where the hub's relay, the
# webhook receiver and the qualify-deploy container are, as 172.30.78.41 (its private listener in the phase's
# satbooth.json). The bundle's own network, its public listener and its one published port stay as shipped.
services:
  satbooth:
    networks:
      regtest:
        ipv4_address: 172.30.78.41

networks:
  regtest:
    name: satbooth-regtest_regtest
    external: true
