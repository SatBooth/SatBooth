# Test-only configuration for the regtest network. The password is a fixed test string and guards nothing.
regtest=1

[regtest]
rpcbind=0.0.0.0
rpcallowip=172.30.78.0/24
rpcuser=regtest
rpcpassword=regtest-only-rpc
fallbackfee=0.0002

# SatBooth's own RPC user for the on-chain phases: rpcauth plus rpcwhitelist with exactly the runtime method set
# (plan 6 constraints). The password is the fixed test string "regtest-only-satbooth" and guards nothing; the line
# was computed once with: python3 -c 'import hmac,os; s=os.urandom(16).hex(); print("satbooth:"+s+"$"+hmac.new(s.encode(),b"regtest-only-satbooth","sha256").hexdigest())'
# The rpcuser/rpcpassword pair above joins the same credential list (src/httprpc.cpp InitRPCAuthentication), so both
# users work.
rpcauth=satbooth:d5272b089a2fc1337805bcbf9b002454$a7260c806094b44956be7854f1a68ad65c89e017284f71c43f07f268c301e80a
rpcwhitelist=satbooth:getnewaddress,getaddressinfo,deriveaddresses,listsinceblock,gettransaction,getmempoolentry,getblockchaininfo,getwalletinfo,listdescriptors,getdescriptorinfo,getmempoolinfo,gettxspendingprevout

# The hubs' RPC user (LDK_BITCOIND_RPC_USER in compose.yml), confined to the eleven calls of the hub's chain source
# (docs/dependencies.md §8), as deploy/hub/config-example/bitcoin.conf confines it. The password is the fixed test
# string "regtest-only-hub" and guards nothing; the line was computed once with the command above, for "hub" and that
# password. A refused call logs "RPC User hub not allowed to call method <name>" (src/httprpc.cpp), which
# scripts/qualify.sh's end check counts.
rpcauth=hub:2d77603ee5a8fa8bf0d79ae1416011f7$7e2cc7024cea8f1652b5df7e08020fa3fc0b87b219ecbd8635bc5f780d645119
rpcwhitelist=hub:getblockchaininfo,getblockheader,getblock,getblockhash,gettxout,getrawmempool,getmempoolentry,getrawtransaction,getmempoolinfo,estimatesmartfee,sendrawtransaction

# rpcwhitelistdefault=0 leaves every user without a whitelist unrestricted: here the rpcuser "regtest", which the
# mining and funding helpers use. Without it, any rpcwhitelist line denies such a user every call (src/httprpc.cpp:314).
rpcwhitelistdefault=0
